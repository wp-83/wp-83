<svg
  width="720"
  height="300"
  viewBox="0 0 720 300"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Terminal -->
  <rect
    x="1"
    y="1"
    width="718"
    height="298"
    rx="12"
    fill="#18181B"
    stroke="#3F3F46"
  />

  <!-- Header -->
  <path
    d="M13 1 H707 A12 12 0 0 1 719 13 V45 H1 V13 A12 12 0 0 1 13 1"
    fill="#27272A"
  />

  <!-- Window Controls -->
  <circle cx="22" cy="23" r="5" fill="#71717A"/>
  <circle cx="40" cy="23" r="5" fill="#71717A"/>
  <circle cx="58" cy="23" r="5" fill="#71717A"/>

  <!-- Title -->
  <text
    x="360"
    y="28"
    text-anchor="middle"
    font-family="monospace"
    font-size="11"
    fill="#A1A1AA"
  >
    william — profile
  </text>

  <!-- Shortcut -->
  <text
    x="680"
    y="28"
    text-anchor="end"
    font-family="monospace"
    font-size="10"
    fill="#71717A"
  >
    ⌘ K
  </text>

  <!-- Command: whoami -->
  <text
    x="28"
    y="82"
    font-family="monospace"
    font-size="13"
  >
    <tspan fill="#A78BFA">❯</tspan>
    <tspan dx="8" fill="#E4E4E7">whoami</tspan>
  </text>

  <!-- Output -->
  <text
    x="48"
    y="105"
    font-family="monospace"
    font-size="12"
    fill="#A1A1AA"
  >
    William Pratama
  </text>

  <!-- Command: about -->
  <text
    x="28"
    y="145"
    font-family="monospace"
    font-size="13"
  >
    <tspan fill="#A78BFA">❯</tspan>
    <tspan dx="8" fill="#E4E4E7">cat about.md</tspan>
  </text>

  <!-- About -->
  <text
    x="48"
    y="169"
    font-family="monospace"
    font-size="12"
    fill="#A1A1AA"
  >
    Software Engineer in Progress
  </text>

  <text
    x="48"
    y="191"
    font-family="monospace"
    font-size="12"
    fill="#71717A"
  >
    Building thoughtful experiences through code.
  </text>

  <!-- Bottom Context -->
  <text
    x="28"
    y="239"
    font-family="monospace"
    font-size="10"
    fill="#71717A"
  >
    ~/github
  </text>

  <text
    x="692"
    y="239"
    text-anchor="end"
    font-family="monospace"
    font-size="10"
    fill="#86EFAC"
  >
    main ✓
  </text>

  <!-- Current Prompt -->
  <text
    x="28"
    y="270"
    font-family="monospace"
    font-size="13"
    fill="#A78BFA"
  >
    ❯
  </text>

  <!-- Cursor -->
  <rect
    x="48"
    y="258"
    width="7"
    height="15"
    rx="1"
    fill="#A1A1AA"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.2s"
      repeatCount="indefinite"
    />
  </rect>
</svg>
